name: Publish and deploy API

# On every merge to master: test, publish ghcr.io/<owner>/snaplingo-api, then deploy through the configured target.
# Version tags (v1.2.3) only publish an image.
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/snaplingo-api

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Same tag the publish job pushed (docker/metadata-action: sha, 7 characters), lower-cased for GHCR.
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_REF="ghcr.io/${OWNER}/snaplingo-api:sha-${GITHUB_SHA::7}"

          # The VM's forced command takes the image reference and reads the new infra/ files from stdin.
          tar czf - infra | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "$IMAGE_REF"

      - name: Check the public endpoint
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          [ -n "$DEPLOY_URL" ] || { echo "DEPLOY_URL variable not set; skipping"; exit 0; }
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 10 "$DEPLOY_URL/health" && exit 0
            sleep 5
          done
          echo "::error::$DEPLOY_URL/health did not answer"; exit 1

  deploy-synology:
    name: Deploy to Synology
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, synology]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-synology
      cancel-in-progress: false
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/volume1/docker/snaplingo/app' }}
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/synology

      - name: Check the NAS setup
        run: |
          docker compose version
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::$DEPLOY_DIR/.env is missing; copy deploy/synology/.env.example there and fill it in"
            exit 1
          fi

      - name: Copy compose file
        run: cp deploy/synology/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and restart
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose stop api
          docker compose pull api
          docker compose up -d --wait --wait-timeout 300 --remove-orphans
          echo "Running commit $(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' snaplingo-api)"

      - name: Show API log
        if: failure()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose logs --tail 200 api

      - name: Clean up
        if: always()
        run: |
          docker logout ghcr.io
          docker image prune -af --filter "label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
