services:
  postgres:
    image: postgres:16-alpine
    container_name: snaplingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snaplingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snaplingo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-snaplingo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - snaplingo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snaplingo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  snaplingo_postgres_data:
